services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: bloodlink-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-bloodlink}
      POSTGRES_USER: ${DB_USER:-bloodlink_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bloodlink_secret}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-bloodlink_user} -d ${DB_NAME:-bloodlink}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bloodlink-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-bloodlink}
      DB_USER: ${DB_USER:-bloodlink_user}
      DB_PASSWORD: ${DB_PASSWORD:-bloodlink_secret}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      AI_SERVICE_URL: http://ai-service:8000
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@bloodlink.lk}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-AdminSecurePassword123!}
    ports:
      - "${SERVER_PORT:-8080}:8080"

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: bloodlink-ai-service
    restart: unless-stopped
    environment:
      PORT: 8000
    ports:
      - "8000:8000"

volumes:
  postgres_data:
