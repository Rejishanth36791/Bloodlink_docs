spring.application.name=bloodlink-backend

# Import optional .env configuration from root or backend directory
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# Server Configuration
server.port=${SERVER_PORT:8080}

# Database Connection (PostgreSQL + PostGIS)
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bloodlink}?stringtype=unspecified}
spring.datasource.username=${DB_USER:bloodlink_user}
spring.datasource.password=${DB_PASSWORD:bloodlink_secret}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.data-source-properties.stringtype=unspecified
spring.datasource.hikari.pool-name=BloodLinkHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# JPA & Hibernate Spatial (PostgreSQLDialect is auto-detected by Hibernate 6)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway Database Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.clean-disabled=true
spring.flyway.locations=classpath:db/migration

# Jackson JSON & Date/Time Handling (Sri Lanka Timezone)
spring.jackson.time-zone=Asia/Colombo
spring.jackson.serialization.write-dates-as-timestamps=false

# Actuator Endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Swagger / OpenAPI Documentation
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Multipart File Upload Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT Configuration
bloodlink.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
bloodlink.jwt.access-expiration-minutes=${JWT_ACCESS_MIN:15}
bloodlink.jwt.refresh-expiration-days=${JWT_REFRESH_DAYS:7}

# Bootstrap Admin Credentials
bloodlink.admin.email=${ADMIN_EMAIL:admin@bloodlink.lk}
bloodlink.admin.password=${ADMIN_PASSWORD:AdminSecurePassword123!}

# AI Service Configuration
bloodlink.ai-service.url=${AI_SERVICE_URL:http://localhost:8000}

# Matching Algorithm Weights (0.5 compat + 0.3 proximity + 0.2 reliability)
bloodlink.matching.weight-compat=0.5
bloodlink.matching.weight-proximity=0.3
bloodlink.matching.weight-reliability=0.2
bloodlink.matching.response-window-minutes=10
bloodlink.matching.escalation-radius-steps=40,80,150

# Firebase (Phone OTP Verification & FCM Notifications)
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:}
firebase.project-id=${FIREBASE_PROJECT_ID:bloodlink-lk}

# CORS Configuration (Permits Flutter Web, Mobile Emulators, Localhost)
cors.allowed-origins=${CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*,http://10.0.2.2:*,http://localhost:3000,http://localhost:8080,*}

# Logging Configuration
logging.level.lk.bloodlink=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
